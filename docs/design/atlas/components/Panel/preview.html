<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Panel</title><style>body{margin:0;padding:20px;background:var(--sea)}</style></head>
<body>
<div class="at">
<div class="at-row" style="align-items:stretch;gap:16px">
<section class="at-panel" style="width:260px"><div class="at-panel-head"><h3 class="at-d2">Tu día</h3><span class="at-status at-status-warning">84 de energía</span></div><div class="at-panel-body at-support">Lo cotidiano: listas, formularios, tu día.</div></section>
<section class="at-panel-ink" style="width:220px;padding:20px 22px"><h3 class="at-d3">Tinta</h3><p style="margin:6px 0 0;font-size:14px;color:var(--on-ink-muted)">Decisiones y marcadores: votar, la batalla en vivo.</p></section>
<section class="at-panel-nation" style="width:220px;padding:20px 22px"><span class="at-place" style="font-size:28px">Argentina</span><p style="margin:6px 0 0;font-size:14px">Lo que es de tu país: gobierno, bienvenida.</p></section>
<section style="width:200px;padding:20px 22px;border-radius:var(--radius-l);background:var(--sea-deep)"><h3 class="at-d3">Mapa</h3><p style="margin:6px 0 0;font-size:14px">El escenario: el mapa debajo, los paneles encima.</p></section>
</div>
</div>
</body>
</html>
