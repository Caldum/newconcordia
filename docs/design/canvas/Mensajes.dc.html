<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mensajes y avisos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=EB+Garamond:ital,wght@1,500;1,600&amp;display=swap">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}a{color:#2457D6;text-decoration:none}a:hover{text-decoration:underline}:focus-visible{outline:3px solid #1F5FB8;outline-offset:2px;box-shadow:0 0 0 7px #FFFFFF}button,input,select,textarea{font-family:inherit}.bp:hover{background:#2A3650!important;text-decoration:none}.bw:hover{background:#B92E25!important;text-decoration:none}.bs:hover,.bg:hover{background:#F1F4F8!important;text-decoration:none}a.li:hover,.li:hover{background:#F4F6F9;text-decoration:none}.in:focus{outline:0;border-color:#2457D6!important;box-shadow:0 0 0 4px rgba(36,87,214,.14)}.segb:hover{color:#172033!important}.dot{animation:pl 1.8s ease-out infinite}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(217,58,47,.45)}100%{box-shadow:0 0 0 9px rgba(217,58,47,0)}}.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{transform:translateY(18px) rotate(-1deg)}to{transform:translateY(0) rotate(-2.5deg)}}@media (prefers-reduced-motion:reduce){.dot,.rise{animation:none}}</style>
</helmet>
<div style="background:#E4EBF0;color:#13202E;font-family:'Archivo',system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased">
<dc-import name="Barra" activo="prensa" hint-size="100%,68px"></dc-import>
<main style="max-width:1320px;margin:0 auto;padding:28px 32px 72px;box-sizing:border-box">
<nav aria-label="Sección" style="display:flex;gap:28px;flex-wrap:wrap;margin:0 0 28px;box-shadow:inset 0 -1px 0 #C3CDD5"><a href="Noticias.dc.html" style="padding:10px 2px 9px;font-weight:600;font-size:15px;text-decoration:none;border-bottom:3px solid transparent;color:#556372">Portada</a><a href="Escribir.dc.html" style="padding:10px 2px 9px;font-weight:600;font-size:15px;text-decoration:none;border-bottom:3px solid transparent;color:#556372">Escribir</a><a href="Mensajes.dc.html" aria-current="page" style="padding:10px 2px 9px;font-weight:600;font-size:15px;text-decoration:none;border-bottom:3px solid #13202E;color:#13202E">Mensajes</a><a href="Rankings.dc.html" style="padding:10px 2px 9px;font-weight:600;font-size:15px;text-decoration:none;border-bottom:3px solid transparent;color:#556372">Rankings</a></nav>
<div style="background:#FFFFFF;border-radius:8px;box-shadow:inset 0 0 0 1px #D2DAE1;display:flex;flex-wrap:wrap;min-height:700px;overflow:hidden">
<aside style="flex:1 1 320px;min-width:0;border-right:1px solid #D6DEE4;display:flex;flex-direction:column">
<div style="padding:16px"><div role="tablist" aria-label="Bandeja" style="display:inline-flex;padding:3px;border-radius:8px;background:#E1E7EC;gap:2px;display:flex"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" class="segb" style="border:0;min-height:36px;padding:0 14px;border-radius:6px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:1;{{t.estilo}}">{{t.nombre}}</button></sc-for></div></div>
<sc-if value="{{verMsj}}" hint-placeholder-val="{{ true }}"><div style="padding:0 8px 8px;display:flex;flex-direction:column;gap:2px"><sc-for list="{{chats}}" as="c" hint-placeholder-count="4"><button type="button" onClick="{{c.pick}}" class="li" style="display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:6px;color:#13202E;text-decoration:none;border:0;text-align:left;width:100%;cursor:pointer;font-size:15px;{{c.fondo}}"><span style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-weight:700;font-size:13px;flex:none;box-sizing:border-box;border-radius:4px;{{c.tono}}">{{c.ini}}</span><span style="flex:1;min-width:0"><b style="font-weight:600;display:block">{{c.nombre}}</b><span style="font-size:13px;color:#556372;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{c.ult}}</span></span><span style="font-size:13px;color:#556372">{{c.hace}}</span></button></sc-for></div></sc-if>
<sc-if value="{{verAv}}" hint-placeholder-val="{{ false }}"><div style="padding:0 8px 8px;display:flex;flex-direction:column;gap:2px">
<a href="BatallaFin.dc.html" class="li" style="display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:6px;color:#13202E;text-decoration:none;align-items:flex-start"><span style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;flex:none;background:#E1F4EC;color:#0A6A49;width:36px;height:36px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6L12 3z"/></svg></span><span style="flex:1"><b style="font-weight:600;display:block;font-size:15px">Argentina resistió en el Norte Andino</b><span style="font-size:13px;color:#556372">Ayer, 23:58</span></span></a>
<a href="Congreso.dc.html" class="li" style="display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:6px;color:#13202E;text-decoration:none;align-items:flex-start"><span style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;flex:none;background:#E6EDFC;color:#1D47B0;width:36px;height:36px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8.5 10V4.5h7V10M10.5 7.5l1.2 1.2 2-2.4"/></svg></span><span style="flex:1"><b style="font-weight:600;display:block;font-size:15px">Tu propuesta de hospitales tiene 78 % a favor</b><span style="font-size:13px;color:#556372">Hace 2 h</span></span></a>
<a href="Empresa.dc.html" class="li" style="display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:6px;color:#13202E;text-decoration:none;align-items:flex-start"><span style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;flex:none;background:#FFF2D4;color:#7A4800;width:36px;height:36px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 3.5 2.5 20h19L12 3.5zM12 10v4.5M12 17.2v.1"/></svg></span><span style="flex:1"><b style="font-weight:600;display:block;font-size:15px">Taller Ríos tiene hierro para 1 día</b><span style="font-size:13px;color:#556372">Hace 3 h</span></span></a>
</div></sc-if>
</aside>
<section style="flex:2 1 520px;min-width:0;display:flex;flex-direction:column">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid #D2DAE1;justify-content:flex-start"><span style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-weight:700;font-size:13px;flex:none;box-sizing:border-box;border-radius:4px;{{sel.tono}}">{{sel.ini}}</span><div><b style="font-weight:700;display:block">{{sel.nombre}}</b><span style="font-size:13px;color:#556372">{{sel.rol}}</span></div><a href="Perfil.dc.html" style="font-size:14px;font-weight:600;margin-left:auto">Ver perfil</a></div>
<div style="flex:1;padding:24px;display:flex;flex-direction:column;gap:12px;background:#F7F9FB">
<sc-for list="{{hilo}}" as="m" hint-placeholder-count="4"><div style="display:flex;{{m.lado}}"><div style="max-width:70%;padding:10px 14px;border-radius:6px;font-size:15px;{{m.tono}}">{{m.txt}}<span style="display:block;font-size:12px;opacity:.7;margin-top:2px">{{m.hora}}</span></div></div></sc-for>
</div>
<div style="padding:14px;border-top:1px solid #D6DEE4;display:flex;gap:8px"><input class="in" aria-label="Escribe un mensaje" placeholder="Escribe un mensaje" style="height:48px;padding:0 14px;border-radius:6px;border:1px solid #7F8B99;background:#FFFFFF;box-sizing:border-box;width:100%;font-size:16px;color:#13202E;height:44px"><button style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;font-weight:650;font-size:15px;border:0;text-decoration:none;white-space:nowrap;box-sizing:border-box;cursor:pointer;background:#13202E;color:#FFFFFF" type="button" class="bp" onClick="{{enviar}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M20.5 3.5 10 14M20.5 3.5 14 20.5l-4-6.5-6.5-4 17-6.5z"/></svg>Enviar</button></div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'msj', c: 0, env: false }; }
  renderVals() {
    var s = this, st = this.state;
    var C = [['Martín Acosta','MA','background:#E3EFF9;color:#1C5B8C','Te vendo 40 armas Q3 a 37','hace 12 min','Compañero de resistencia, rango 15',[['in','¿Entras a las 20 a Cuyo?','19:41'],['out','Sí, con 8 golpes. Me faltan armas.','19:44'],['in','Te vendo 40 armas Q3 a 37, más barato que el mercado.','19:46']]],
             ['Adrián Sosa','AS','background:#13202E;color:#FFFFFF','Necesito el informe de hospitales','hace 1 h','Presidente de Argentina',[['in','Camila, necesito el informe de hospitales antes de la votación.','18:02'],['out','Te lo envío en una hora. Mendoza Norte tiene 31.200.','18:10']]],
             ['Diego Paz','DP','background:#E1F4EC;color:#0A6A49','Subamos el salario a 46','ayer','Tu socio en Taller Ríos',[['in','Subamos el salario a 46 para no perder a Sofía.','ayer']]],
             ['Pablo Garrido','PG','background:#FCE8E6;color:#A3241B','Buena pelea en el Norte','ayer','España, rango 18',[['in','Buena pelea en el Norte Andino. Nos vemos en Cuyo.','ayer']]]];
    var sel = C[st.c];
    var hilo = sel[6].map(function (m) { return { txt: m[1], hora: m[2], lado: m[0] === 'out' ? 'justify-content:flex-end' : '', tono: m[0] === 'out' ? 'background:#13202E;color:#FFFFFF' : 'background:#FFFFFF;box-shadow:inset 0 0 0 1px #D2DAE1' }; });
    if (st.env && st.c === 0) hilo.push({ txt: 'Bueno, te compro 20. ¿Me las envías ahora?', hora: 'ahora', lado: 'justify-content:flex-end', tono: 'background:#13202E;color:#FFFFFF' });
    return { tabs: [['msj','Mensajes'],['av','Avisos 3']].map(function (t) { var on = st.tab === t[0]; return { nombre: t[1], on: on ? 'true' : 'false', estilo: on ? 'background:#FFFFFF;color:#13202E;box-shadow:0 1px 2px rgba(19,32,46,.14)' : 'background:transparent;color:#556372', pick: function () { s.setState({ tab: t[0] }); } }; }),
      verMsj: st.tab === 'msj', verAv: st.tab === 'av',
      chats: C.map(function (c, i) { return { nombre: c[0], ini: c[1], tono: c[2], ult: c[3], hace: c[4], fondo: i === st.c ? 'background:#EDF1F4' : 'background:transparent', pick: function () { s.setState({ c: i }); } }; }),
      sel: { nombre: sel[0], ini: sel[1], tono: sel[2], rol: sel[5] }, hilo: hilo, enviar: function () { s.setState({ env: true }); } };
  }
}
</script>
</body>
</html>
