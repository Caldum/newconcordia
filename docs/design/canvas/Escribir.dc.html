<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escribir un artículo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=EB+Garamond:ital,wght@1,500;1,600&amp;display=swap">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}a{color:#2457D6;text-decoration:none}a:hover{text-decoration:underline}:focus-visible{outline:3px solid #1F5FB8;outline-offset:2px;box-shadow:0 0 0 7px #FFFFFF}button,input,select,textarea{font-family:inherit}.bp:hover{background:#2A3650!important;text-decoration:none}.bw:hover{background:#B92E25!important;text-decoration:none}.bs:hover,.bg:hover{background:#F1F4F8!important;text-decoration:none}a.li:hover,.li:hover{background:#F4F6F9;text-decoration:none}.in:focus{outline:0;border-color:#2457D6!important;box-shadow:0 0 0 4px rgba(36,87,214,.14)}.segb:hover{color:#172033!important}.dot{animation:pl 1.8s ease-out infinite}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(217,58,47,.45)}100%{box-shadow:0 0 0 9px rgba(217,58,47,0)}}.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{transform:translateY(18px) rotate(-1deg)}to{transform:translateY(0) rotate(-2.5deg)}}@media (prefers-reduced-motion:reduce){.dot,.rise{animation:none}}</style>
</helmet>
<div style="background:#E4EBF0;color:#13202E;font-family:'Archivo',system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased">
<dc-import name="Barra" activo="prensa" hint-size="100%,68px"></dc-import>
<main style="max-width:1320px;margin:0 auto;padding:28px 32px 72px;box-sizing:border-box">
<nav aria-label="Sección" style="display:flex;gap:28px;flex-wrap:wrap;margin:0 0 28px;box-shadow:inset 0 -1px 0 #C3CDD5"><a href="Noticias.dc.html" style="padding:10px 2px 9px;font-weight:600;font-size:15px;text-decoration:none;border-bottom:3px solid transparent;color:#556372">Portada</a><a href="Escribir.dc.html" aria-current="page" style="padding:10px 2px 9px;font-weight:600;font-size:15px;text-decoration:none;border-bottom:3px solid #13202E;color:#13202E">Escribir</a><a href="Mensajes.dc.html" style="padding:10px 2px 9px;font-weight:600;font-size:15px;text-decoration:none;border-bottom:3px solid transparent;color:#556372">Mensajes</a><a href="Rankings.dc.html" style="padding:10px 2px 9px;font-weight:600;font-size:15px;text-decoration:none;border-bottom:3px solid transparent;color:#556372">Rankings</a></nav>
<sc-if value="{{publicado}}" hint-placeholder-val="{{ false }}">
<section style="background:#FFFFFF;border-radius:8px;box-shadow:inset 0 0 0 1px #D2DAE1;padding:40px;max-width:720px;display:flex;flex-direction:column;gap:14px;align-items:flex-start">
<span style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:6px;flex:none;width:56px;height:56px;background:#E1F4EC;color:#0A6A49"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
<h1 style="font-stretch:112%;font-weight:800;font-size:44px;line-height:1.04;letter-spacing:-.018em;margin:0">Publicaste tu artículo</h1>
<p style="color:#556372;margin:0">Ya aparece en la prensa de Argentina. Si suma respaldos, sube a la portada.</p>
<div style="display:flex;gap:10px"><a style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;font-weight:650;font-size:15px;border:0;text-decoration:none;white-space:nowrap;box-sizing:border-box;cursor:pointer;background:#13202E;color:#FFFFFF" href="Articulo.dc.html" class="bp">Ver el artículo</a><button style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;font-weight:650;font-size:15px;border:0;text-decoration:none;white-space:nowrap;box-sizing:border-box;cursor:pointer;background:#FFFFFF;color:#13202E;box-shadow:inset 0 0 0 1px #7F8B99" type="button" class="bs" onClick="{{otra}}">Escribir otro</button></div>
</section>
</sc-if>
<sc-if value="{{escribiendo}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
<section style="background:#FFFFFF;border-radius:8px;box-shadow:inset 0 0 0 1px #D2DAE1;flex:2 1 640px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:18px">
<input aria-label="Título" value="Ganamos el Norte Andino: qué aprendimos" style="border:0;outline:0;font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:800;font-size:36px;color:#13202E;width:100%;padding:0">
<textarea aria-label="Texto del artículo" rows="10" style="border:0;outline:0;resize:vertical;font-size:18px;line-height:1.65;color:#13202E;width:100%;padding:0">Ayer resistimos 3 a 1. Lo que nos dio la batalla fue la ronda 3: entramos de noche, con armas Q3 y el hospital lleno.

En Cuyo podemos repetirlo. Si cada ciudadano de nivel 20 o más da 10 golpes hoy, ganamos la ronda.</textarea>
<div style="display:flex;gap:6px;flex-wrap:wrap;padding-top:14px;border-top:1px solid #D6DEE4"><button type="button" class="bg" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;font-weight:650;font-size:15px;border:0;text-decoration:none;white-space:nowrap;box-sizing:border-box;cursor:pointer;background:transparent;color:#13202E;min-height:36px;font-weight:800">N</button><button type="button" class="bg" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;font-weight:650;font-size:15px;border:0;text-decoration:none;white-space:nowrap;box-sizing:border-box;cursor:pointer;background:transparent;color:#13202E;min-height:36px;font-style:italic">I</button><button type="button" class="bg" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;font-weight:650;font-size:15px;border:0;text-decoration:none;white-space:nowrap;box-sizing:border-box;cursor:pointer;background:transparent;color:#13202E;min-height:36px">Enlace</button><button type="button" class="bg" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;font-weight:650;font-size:15px;border:0;text-decoration:none;white-space:nowrap;box-sizing:border-box;cursor:pointer;background:transparent;color:#13202E;min-height:36px">Imagen</button><span style="font-size:13px;color:#556372;margin-left:auto;align-self:center">312 de 5.000 caracteres</span></div>
</section>
<aside style="background:#FFFFFF;border-radius:8px;box-shadow:inset 0 0 0 1px #D2DAE1;flex:1 1 300px;min-width:0"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid #D2DAE1"><h2 style="font-stretch:112%;font-weight:750;font-size:23px;line-height:1.15;letter-spacing:-.01em;margin:0">Publicación</h2></div><div style="padding:20px 22px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;flex-direction:column;gap:6px"><label style="font-weight:600;font-size:14px" for="dd">Dónde</label><select style="height:48px;padding:0 14px;border-radius:6px;border:1px solid #7F8B99;background:#FFFFFF;box-sizing:border-box;width:100%;font-size:16px;color:#13202E" id="dd" class="in"><option>Como Camila Ríos</option><option>En la Gaceta del Comercio (colaboradora)</option></select></div>
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:600;font-size:14px">Sección</span><div role="tablist" aria-label="Sección" style="display:inline-flex;padding:3px;border-radius:8px;background:#E1E7EC;gap:2px;display:flex"><sc-for list="{{secs}}" as="c" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" class="segb" style="border:0;min-height:36px;padding:0 14px;border-radius:6px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:1;{{c.estilo}}">{{c.nombre}}</button></sc-for></div></div>
<div style="display:flex;gap:12px;padding:14px 16px;border-radius:6px;font-size:15px;line-height:1.45;background:#E6EDFC;color:#1A3A8F;font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/></svg><span>Moderamos los artículos con insultos o trampas. Lee las reglas de prensa.</span></div>
<button style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;font-weight:650;font-size:15px;border:0;text-decoration:none;white-space:nowrap;box-sizing:border-box;cursor:pointer;background:#13202E;color:#FFFFFF;min-height:52px;padding:0 24px;font-size:16px;border-radius:6px" type="button" class="bp" onClick="{{publicar}}">Publicar</button>
<button style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;font-weight:650;font-size:15px;border:0;text-decoration:none;white-space:nowrap;box-sizing:border-box;cursor:pointer;background:transparent;color:#13202E" type="button" class="bg">Guardar borrador</button>
</div></aside>
</div>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sec: 'guerra', pub: false }; }
  renderVals() { var s = this, st = this.state;
    return { secs: [['guerra','Guerra'],['eco','Economía'],['pol','Política']].map(function (c) { var on = st.sec === c[0]; return { nombre: c[1], on: on ? 'true' : 'false', estilo: on ? 'background:#FFFFFF;color:#13202E;box-shadow:0 1px 2px rgba(19,32,46,.14)' : 'background:transparent;color:#556372', pick: function () { s.setState({ sec: c[0] }); } }; }),
      publicado: st.pub, escribiendo: !st.pub, publicar: function () { s.setState({ pub: true }); }, otra: function () { s.setState({ pub: false }); } }; }
}
</script>
</body>
</html>
