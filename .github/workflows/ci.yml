name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Build-time public configuration; this build is checked, never deployed.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Worker binding types are up to date
        run: pnpm --filter @concordia/clock types:check
      - name: Unit tests with coverage
        run: pnpm -r --if-present test:coverage
      - run: pnpm build
      - name: Initial JavaScript budget
        run: pnpm --filter @concordia/web size
      - name: Dependency audit
        run: pnpm audit --audit-level high

  database:
    name: Migrations and pgTAP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Map and world data tests
        run: python3 -I -m unittest discover -s data/map/scripts
      - name: Lint migrations (squawk)
        run: pnpm db:lint
      - name: Start Postgres with every migration applied
        run: pnpm exec supabase db start
      - name: pgTAP
        run: pnpm db:test
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- packages/db-types/src/database.ts

  e2e:
    name: Journeys and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Cloudflare's Turnstile test site key; local Auth checks tokens with the matching test secret.
      VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Start local Supabase (database, API, auth and the test mailbox)
        run: >-
          pnpm exec supabase start
          -x studio,imgproxy,vector,logflare,storage-api,edge-runtime,postgres-meta,supavisor,realtime
      - name: Public configuration for the web build
        run: |
          pnpm exec supabase status -o env \
            | grep -E '^(API_URL|PUBLISHABLE_KEY)=' \
            | sed -e 's/^API_URL=/VITE_SUPABASE_URL=/' -e 's/^PUBLISHABLE_KEY=/VITE_SUPABASE_PUBLISHABLE_KEY=/' -e 's/"//g' \
            >> "$GITHUB_ENV"
      - name: Install Chromium
        run: pnpm --filter @concordia/web exec playwright install --with-deps chromium
      - name: Web journeys
        run: pnpm --filter @concordia/web e2e
      - name: Atlas gallery
        run: pnpm --filter @concordia/atlas e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-reports
          path: |
            apps/web/playwright-report
            packages/atlas/playwright-report
          retention-days: 7

  ci-passed:
    name: ci-passed
    if: always()
    needs: [quality, database, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job finished with '$result'."
              exit 1
            fi
          done
