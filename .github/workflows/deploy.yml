name: Deploy

# develop → staging (automatic). main → production (manual approval on the `production` environment).
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Check credentials
        id: credentials
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SECRET_KEY SUPABASE_PROJECT_REF CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Deployment skipped::Missing credentials in the '$WRANGLER_ENV' environment:$missing. See docs/setup.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.credentials.outputs.ready == 'true'

      # Migrations go first: every migration is backward compatible with the web already deployed.
      - name: Apply database migrations
        if: steps.credentials.outputs.ready == 'true'
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm exec supabase db push --include-all

      - name: Build web
        if: steps.credentials.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_GOOGLE_SIGN_IN: ${{ vars.GOOGLE_SIGN_IN || 'false' }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
          VITE_APP_ENV: ${{ env.WRANGLER_ENV }}
        run: pnpm --filter @concordia/web build

      - name: Deploy web
        if: steps.credentials.outputs.ready == 'true'
        working-directory: apps/web
        run: |
          if [ "$WRANGLER_ENV" = "production" ]; then
            pnpm exec wrangler deploy
          else
            pnpm exec wrangler deploy --env staging
          fi

      # The clock goes after the migrations: the jobs it triggers must already exist.
      - name: Deploy clock
        if: steps.credentials.outputs.ready == 'true'
        working-directory: apps/clock
        run: |
          secrets_file="$RUNNER_TEMP/clock.secrets"
          trap 'rm -f "$secrets_file"' EXIT
          printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY" > "$secrets_file"
          args=(--var "SUPABASE_URL:https://$SUPABASE_PROJECT_REF.supabase.co" --secrets-file "$secrets_file")
          if [ "$WRANGLER_ENV" != "production" ]; then args+=(--env staging); fi
          pnpm exec wrangler deploy "${args[@]}"
